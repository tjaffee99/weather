<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Weather Atlas</title>
    <meta name="description" content="Live global weather and a historical climate finder: discover where and when the weather matches what you like." />
    <meta name="theme-color" content="#eeefe9" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%235fcde8'/%3E%3Cstop offset='.5' stop-color='%23f8d553'/%3E%3Cstop offset='1' stop-color='%23ea6034'/%3E%3C/linearGradient%3E%3C/defs%3E%3Ccircle cx='32' cy='32' r='28' fill='url(%23g)'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="map" aria-label="Weather map"></div>

    <header class="topbar">
      <nav class="modes glass" id="modes" role="tablist" aria-label="Mode">
        <button role="tab" data-mode="climate" aria-selected="true">Climate finder</button>
        <button role="tab" data-mode="live" aria-selected="false">Live weather</button>
      </nav>
      <div class="tools">
        <div class="search glass">
          <input id="search" type="search" placeholder="Search a city" autocomplete="off" aria-label="Search a city" />
          <ul id="searchResults" class="search-results" role="listbox"></ul>
        </div>
        <button id="units" class="glass icon-btn" title="Switch units" aria-label="Switch units">°C</button>
        <button id="globe" class="glass icon-btn" title="Globe view" aria-label="Toggle globe view">🌐</button>
      </div>
    </header>

    <aside id="panel" class="panel glass" aria-label="Controls"></aside>
    <button id="panelToggle" class="panel-toggle glass" aria-label="Show controls">☰ Controls</button>

    <div id="bottombar" class="bottombar glass hidden"></div>
    <div id="legend" class="legend glass"></div>
    <div id="card" class="card glass hidden" role="dialog" aria-live="polite"></div>
    <div id="status" class="status glass hidden"><span class="spinner"></span><span id="statusText"></span></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
